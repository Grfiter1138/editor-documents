<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor Documenti</title>
<link rel="icon" type="image/png" href="icon.png">
<!-- Icona e aspetto da app quando la si aggiunge alla schermata Home di iPhone/iPad -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Editor Doc">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<script src="docx.umd.js"></script>
<script>
  // Se la copia locale non c'è, carica la libreria dal CDN (serve internet)
  if (!window.docx) document.write('<script src="https://cdn.jsdelivr.net/npm/docx@9.0.2/build/index.umd.js"><\/script>');
</script>
<style>
  :root {
    --bg: #f3f4f6;
    --panel: #ffffff;
    --border: #d9dce1;
    --text: #1f2328;
    --muted: #667085;
    --accent: #2563eb;
    --accent-soft: #e8efff;
    --danger: #c0392b;
    --page-shadow: 0 2px 14px rgba(0,0,0,.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px;
    display: flex; flex-direction: column;
  }
  header.top {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header.top h1 { font-size: 16px; margin: 0 12px 0 0; }
  header.top .spacer { flex: 1; }
  button, .btn {
    font: inherit; border: 1px solid var(--border); background: #fff; color: var(--text);
    padding: 6px 11px; border-radius: 6px; cursor: pointer; white-space: nowrap;
  }
  button:hover { background: #f6f7f9; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #1d4fd0; }
  button.small { padding: 3px 8px; font-size: 12px; }
  button.icon { padding: 3px 7px; font-size: 12px; min-width: 26px; }
  button.danger { color: var(--danger); }
  button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  input[type=text], input[type=number], textarea {
    font: inherit; border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; width: 100%;
    background: #fff; color: var(--text);
  }
  input[type=number] { width: 70px; }
  textarea { min-height: 90px; resize: vertical; line-height: 1.45; }
  label.lbl { display: block; font-size: 12px; color: var(--muted); margin: 0 0 3px; }

  main { flex: 1; display: grid; grid-template-columns: minmax(380px, 46%) 1fr; min-height: 0; }
  #editor { overflow-y: auto; padding: 16px; border-right: 1px solid var(--border); }
  #previewWrap { overflow: auto; padding: 24px; }
  input.num { width: 64px; }
  .tabs { display: none; }
  @media (max-width: 1000px) {
    main { grid-template-columns: minmax(0, 1fr); }
    #editor { border-right: 0; }
    #previewWrap { padding: 12px; }
    .tabs { display: flex; gap: 0; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--border); }
    .tabs button { flex: 1; border-radius: 0; margin-left: -1px; }
    .tabs button:first-child { border-radius: 8px 0 0 8px; margin-left: 0; }
    .tabs button:last-child { border-radius: 0 8px 8px 0; }
    body[data-view="edit"] #previewWrap, body[data-view="preview"] #editor { display: none; }
    header.top { padding: 8px 12px; gap: 6px; }
    header.top h1 { width: 100%; margin: 0; }
    header.top .spacer { display: none; }
    #editor { padding: 12px; }
    .card { padding: 12px; }
    .style-form { grid-template-columns: 1fr; gap: 4px; }
    .style-form > label:nth-child(odd) { margin-top: 6px; }
  }
  /* Schermi touch: pulsanti più grandi e testo a 16px (evita lo zoom automatico di Safari sui campi) */
  @media (pointer: coarse) {
    input[type=text], textarea, select { font-size: 16px; }
    button.icon { min-width: 36px; min-height: 34px; font-size: 14px; }
    button.small { padding: 7px 10px; font-size: 13px; }
    .img-item { grid-template-columns: 56px 1fr auto; }
    .img-item img { width: 56px; height: 56px; }
    input[type=range] { height: 28px; }
  }
  .event-box { margin-top: 6px; padding: 10px; border-radius: 8px; background: #f5f8ff; border: 1px solid #d6e2fb; }
  .event-box input.ev-date { width: 110px; }
  .event-box input.ev-time { width: 70px; }
  .event-box label.hint { display: inline-flex; align-items: center; gap: 6px; }
  .hint.ev-msg { color: var(--danger); }
  .page .toc { margin: 6pt 0 0; }
  .page .toc-title { font-family: var(--head-font); font-size: var(--h1-size); color: var(--accent); font-weight: 700; margin: 12pt 0 8pt; }
  .page .toc-item { margin: 0 0 4pt 0.5cm; }
  .page .page-break { border-top: 1px dashed #b8b8b8; margin: 18pt -1cm; text-align: center; font-size: 8pt; color: #a0a0a0; font-family: sans-serif; line-height: 0; }
  .page .page-break span { background: #fff; padding: 0 8px; }
  .share-actions { display: flex; flex-direction: column; gap: 10px; }
  .share-actions button { padding: 12px; font-size: 16px; }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row + .row { margin-top: 8px; }
  .grow { flex: 1; min-width: 0; }
  .section { border-left: 4px solid var(--accent); }
  .para { border: 1px dashed var(--border); border-radius: 8px; padding: 10px; margin-top: 10px; background: #fafbfc; }
  .para-head { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; font-size: 12px; color: var(--muted); }
  .para-head .grow { font-weight: 600; }
  .img-item { display: grid; grid-template-columns: 72px 1fr auto; gap: 10px; align-items: start;
    background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 8px; margin-top: 8px; }
  .img-item img { width: 72px; height: 72px; object-fit: cover; border-radius: 5px; background: #eee; }
  .img-item .ctrls { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .img-item .side { display: flex; flex-direction: column; gap: 4px; }
  .seg { display: inline-flex; }
  .seg button { border-radius: 0; margin-left: -1px; }
  .seg button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 6px 6px 0; }
  .size { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .size input[type=range] { flex: 1; min-width: 90px; }
  .hint { font-size: 12px; color: var(--muted); }
  .lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 6px; margin-top: 8px; max-height: 170px; overflow-y: auto; }
  .lib-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 5px; border: 1px solid var(--border); }
  .add-sec { width: 100%; padding: 10px; border-style: dashed; color: var(--accent); }

  .style-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
  .style-tile { border: 2px solid var(--border); border-radius: 8px; padding: 8px; cursor: pointer; background: #fff; }
  .style-tile:hover { border-color: #aab4c3; }
  .style-tile.sel { border-color: var(--accent); background: var(--accent-soft); }
  .style-tile * { pointer-events: none; }
  .style-name { font-size: 11px; color: var(--muted); margin-top: 6px; text-align: center; font-weight: 600; }
  .style-form { display: grid; grid-template-columns: 150px 1fr; gap: 8px 10px; align-items: center; margin-top: 10px; font-size: 13px; }
  .style-form > label:nth-child(odd) { color: var(--muted); font-size: 12px; }
  select { font: inherit; border: 1px solid var(--border); border-radius: 6px; padding: 5px 6px; background: #fff; color: var(--text); }
  input[type=color] { width: 48px; height: 30px; border: 1px solid var(--border); border-radius: 6px; padding: 2px; background: #fff; }

  /* ---------- Anteprima pagina (A4) ---------- */
  .page {
    width: 21cm; min-height: 29.7cm; padding: 2cm; margin: 0 auto; background: #fff; box-shadow: var(--page-shadow);
    font-family: var(--body-font); font-size: var(--body-size); line-height: calc(var(--line) * 1.2); color: #000;
  }
  .page .doc-title { font-family: var(--head-font); font-size: var(--title-size); color: var(--title-color); text-align: var(--title-align);
    text-transform: var(--title-transform); font-weight: var(--title-weight); line-height: 1.15; margin: 0 0 4pt; }
  .page .doc-subtitle { font-family: var(--head-font); text-align: var(--title-align); font-style: italic; color: #555; font-size: 13pt; margin: 0 0 18pt; }
  .page h2.sec { font-family: var(--head-font); font-size: var(--h1-size); color: var(--accent); font-weight: var(--head-weight);
    border-bottom: var(--head-border); padding-bottom: 2pt; line-height: 1.2; margin: 18pt 0 6pt; }
  .page .secbody::after { content: ""; display: block; clear: both; }
  .page .pblock { margin-bottom: 10pt; }
  .page .ptext { margin: 0; white-space: pre-wrap; text-align: var(--align); }
  .page figure { margin: 0; }
  .page figure img { display: block; width: 100%; height: 100%; }
  .page figure.left { float: left; clear: left; margin: 0 0.4cm 0.3cm 0; }
  .page figure.right { float: right; clear: right; margin: 0 0 0.3cm 0.4cm; }
  .page figure.center { margin: 8pt auto 10pt; clear: both; }
  .page figcaption { font-size: 9pt; font-style: italic; color: #555; text-align: center; padding-top: 3pt; }
  .page .empty { color: #aaa; text-align: center; margin-top: 4cm; font-style: italic; }
  .page { display: flex; flex-direction: column; }
  .page .pbody { flex: 1; }
  .page .hf { font-size: 9pt; color: #444; line-height: 1.25; display: flex; gap: 0.4cm; align-items: center; }
  .page .hf.stack { flex-direction: column; align-items: stretch; gap: 4pt; }
  .page .hf.img-right { flex-direction: row-reverse; }
  .page .hf .hf-text { flex: 1; white-space: pre-wrap; }
  .page .hf .hf-text b { font-size: 10pt; color: #000; }
  .page .hf img { display: block; flex: none; }
  .page .hf-head { margin: -0.8cm 0 0.8cm; padding-bottom: 6pt; }
  .page .hf-foot { margin-top: 0.8cm; padding-top: 6pt; }
  .page .hf-head.line { border-bottom: 0.75pt solid #888; }
  .page .hf-foot.line { border-top: 0.75pt solid #888; }
  .page .pnum { font-size: 9pt; color: #444; margin-top: 4pt; }
  .page .hf-note { font-size: 8pt; color: #b0b0b0; font-style: italic; text-align: center; }

  /* ---------- Finestra libreria ---------- */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
  .modal-bg.open { display: flex; }
  .modal { background: #fff; border-radius: 12px; width: min(760px, 100%); max-height: 85vh; display: flex; flex-direction: column; }
  .modal header { padding: 14px 16px; border-bottom: 1px solid var(--border); font-weight: 600; }
  .modal .body { padding: 16px; overflow-y: auto; }
  .modal footer { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
  .pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
  .pick { border: 2px solid transparent; border-radius: 8px; padding: 4px; cursor: pointer; text-align: center; font-size: 11px; color: var(--muted); }
  .pick img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 5px; display: block; margin-bottom: 3px; }
  .pick span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pick.sel { border-color: var(--accent); background: var(--accent-soft); }

  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #222; color: #fff;
    padding: 9px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 30; }
  #toast.show { opacity: .95; }
</style>
</head>
<body>

<header class="top">
  <h1>Editor Documenti</h1>
  <button data-act="newDoc">Nuovo</button>
  <button data-act="openJson">Apri progetto…</button>
  <button data-act="saveJson">Salva progetto</button>
  <button class="danger" data-act="wipe" title="Cancella il documento e le foto memorizzati in questo browser">🗑 Cancella dal dispositivo</button>
  <span class="spacer"></span>
  <button class="primary" data-act="exportDocx">⬇ Scarica Word (.docx)</button>
</header>

<nav class="tabs">
  <button class="on" data-act="view" data-v="edit">✏️ Modifica</button>
  <button data-act="view" data-v="preview">👁 Anteprima</button>
</nav>
<main>
  <div id="editor"></div>
  <div id="previewWrap"><div class="page" id="preview"></div></div>
</main>

<div class="modal-bg" id="libModal">
  <div class="modal">
    <header>Scegli le foto dalla libreria</header>
    <div class="body"><div class="pick-grid" id="pickGrid"></div></div>
    <footer>
      <span class="hint grow" id="pickCount"></span>
      <button data-act="modalClose">Annulla</button>
      <button class="primary" data-act="modalOk">Inserisci</button>
    </footer>
  </div>
</div>

<div class="modal-bg" id="shareModal">
  <div class="modal" style="width:min(420px,100%)">
    <header>Documento Word pronto</header>
    <div class="body">
      <div class="share-actions">
        <button class="primary" data-act="shareDocx">Apri con… (Word, Mail, WhatsApp…)</button>
        <button data-act="saveDocx">Salva in File</button>
        <button data-act="shareClose">Chiudi</button>
      </div>
    </div>
  </div>
</div>

<input type="file" id="fileImgs" accept="image/*" multiple hidden>
<input type="file" id="fileFolder" webkitdirectory directory multiple hidden>
<input type="file" id="fileLibImgs" accept="image/*" multiple hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>
<div id="toast"></div>

<script>
(() => {
  const CONTENT_W_CM = 17;           // larghezza utile pagina A4 con margini da 2 cm
  const STORAGE_KEY = 'editor-documenti-web-v1';
  const uid = () => Math.random().toString(36).slice(2, 10);
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const round1 = (n) => Math.round(n * 10) / 10;
  const fmt = (n) => String(n).replace('.', ',');                         // 4.5 -> "4,5"
  const parseNum = (v) => parseFloat(String(v).replace(',', '.'));        // accetta sia 4,5 che 4.5
  // iPhone / iPad (anche iPad che si presenta come Mac)
  const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  const newPara = () => ({ id: uid(), text: '', images: [] });
  const newEvent = () => ({ enabled: false, kind: 'evento', date: '', time: '', includeText: false, alert: '15' });
  const newSection = () => ({ id: uid(), title: '', paragraphs: [newPara()], event: newEvent() });
  const newToc = () => ({ enabled: false, title: 'Indice' });
  const newHF = () => ({ enabled: false, scope: 'all', text: '', textAlign: 'center', boldFirst: true, line: true, image: null });
  const newPageNumbers = () => ({ enabled: false, format: 'pagina-di', align: 'center' });
  const defaultDoc = () => ({
    title: '', subtitle: '', sections: [newSection()],
    letterhead: newHF(), footer: newHF(), pageNumbers: newPageNumbers(), style: newStyle(), toc: newToc(),
  });
  // Completa i progetti salvati con versioni precedenti del programma
  function withDefaults(d) {
    d.toc = { ...newToc(), ...(d.toc || {}) };
    (d.sections || []).forEach(sec => { sec.event = { ...newEvent(), ...(sec.event || {}) }; });
    d.letterhead = { ...newHF(), ...(d.letterhead || {}) };
    d.footer = { ...newHF(), ...(d.footer || {}) };
    d.pageNumbers = { ...newPageNumbers(), ...(d.pageNumbers || {}) };
    d.style = { ...newStyle(), ...(d.style || {}) };
    return d;
  }
  const HF_LABEL = { letterhead: 'Carta intestata', footer: 'Piè di pagina' };
  const PN_FORMATS = { 'n': '1', 'pagina': 'Pagina 1', 'pagina-di': 'Pagina 1 di 3', 'n-di': '1 / 3' };

  // Stili del documento: applicati sia all'anteprima sia agli stili di Word (Normale, Titolo, Titolo 1)
  const STYLE_PRESETS = {
    classico: { label: 'Classico', bodyFont: 'Calibri', headFont: 'Calibri Light', bodySize: 11, titleSize: 28, h1Size: 16,
      accent: '#2f5496', titleColor: '#000000', lineSpacing: 1.15, align: 'justify', titleAlign: 'center', headBold: false, headLine: false, titleCaps: false },
    elegante: { label: 'Elegante', bodyFont: 'Georgia', headFont: 'Georgia', bodySize: 11, titleSize: 30, h1Size: 15,
      accent: '#7a4b1e', titleColor: '#3b2a1a', lineSpacing: 1.3, align: 'justify', titleAlign: 'center', headBold: false, headLine: true, titleCaps: false },
    moderno: { label: 'Moderno', bodyFont: 'Arial', headFont: 'Arial', bodySize: 10.5, titleSize: 26, h1Size: 15,
      accent: '#0f766e', titleColor: '#0f766e', lineSpacing: 1.3, align: 'left', titleAlign: 'left', headBold: true, headLine: false, titleCaps: false },
    tecnico: { label: 'Tecnico', bodyFont: 'Verdana', headFont: 'Arial', bodySize: 10, titleSize: 22, h1Size: 13,
      accent: '#1f2937', titleColor: '#1f2937', lineSpacing: 1.2, align: 'left', titleAlign: 'left', headBold: true, headLine: true, titleCaps: true },
    formale: { label: 'Formale', bodyFont: 'Times New Roman', headFont: 'Times New Roman', bodySize: 12, titleSize: 24, h1Size: 14,
      accent: '#000000', titleColor: '#000000', lineSpacing: 1.5, align: 'justify', titleAlign: 'center', headBold: true, headLine: false, titleCaps: true },
  };
  const FONTS = ['Calibri', 'Calibri Light', 'Arial', 'Helvetica', 'Verdana', 'Cambria', 'Georgia', 'Garamond', 'Book Antiqua', 'Times New Roman'];
  const SERIF = ['Cambria', 'Georgia', 'Garamond', 'Book Antiqua', 'Times New Roman'];
  const cssFont = (f) => `"${f}", ${SERIF.includes(f) ? 'Georgia, "Times New Roman", serif' : (f.startsWith('Calibri') ? 'Carlito, ' : '') + '"Helvetica Neue", Arial, sans-serif'}`;
  const newStyle = (key = 'classico') => { const { label, ...rest } = STYLE_PRESETS[key]; return { preset: key, ...rest }; };

  let state = withDefaults(loadLocal() || defaultDoc());
  let library = [];                   // foto caricate dalla cartella (solo in memoria)
  let pendingTarget = null;           // {s, p} paragrafo che riceverà le foto
  let pickSel = new Set();

  // ---------- Persistenza ----------
  function loadLocal() {
    try { const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; } catch { return null; }
  }
  let saveTimer, warnedQuota = false;
  function saveLocal() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
      catch {
        if (!warnedQuota) { toast('Salvataggio automatico non riuscito (foto troppo grandi): usa "Salva progetto".'); warnedQuota = true; }
      }
    }, 400);
  }
  function changed() { renderPreview(); saveLocal(); }

  // ---------- Lookup ----------
  const sec = (s) => state.sections.find(x => x.id === s);
  const para = (s, p) => sec(s)?.paragraphs.find(x => x.id === p);
  const img = (s, p, i) => para(s, p)?.images.find(x => x.id === i);
  // Immagine indicata dai data-attribute di un controllo (foto di paragrafo o logo di intestazione/piè)
  const imgOf = (ds) => ds.hf ? state[ds.hf].image : img(ds.s, ds.p, ds.i);
  function move(arr, id, dir) {
    const i = arr.findIndex(x => x.id === id), j = i + dir;
    if (i < 0 || j < 0 || j >= arr.length) return;
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }

  // ---------- Caricamento immagini ----------
  function readAsDataURL(file) {
    return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
  }
  function loadImage(src) {
    return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
  }
  // Normalizza in PNG/JPEG/GIF e riduce le foto molto grandi per non appesantire il .docx
  async function processFile(file) {
    let dataUrl = await readAsDataURL(file);
    let im = await loadImage(dataUrl);
    let mime = file.type;
    const MAX = 2400;
    const okType = ['image/png', 'image/jpeg', 'image/gif'].includes(mime);
    if (!okType || Math.max(im.naturalWidth, im.naturalHeight) > MAX) {
      const k = Math.min(1, MAX / Math.max(im.naturalWidth, im.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
      const ctx = c.getContext('2d');
      mime = mime === 'image/png' ? 'image/png' : 'image/jpeg';
      if (mime === 'image/jpeg') { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); }
      ctx.drawImage(im, 0, 0, c.width, c.height);
      dataUrl = c.toDataURL(mime, 0.9);
      im = await loadImage(dataUrl);
    }
    return { name: file.name.replace(/\.[^.]+$/, ''), dataUrl, mime, w: im.naturalWidth, h: im.naturalHeight };
  }
  async function processFiles(files) {
    const list = [...files].filter(f => f.type.startsWith('image/') || /\.(jpe?g|png|gif|webp|bmp)$/i.test(f.name));
    const out = [];
    for (const f of list) {
      try { out.push(await processFile(f)); } catch { toast('Impossibile leggere: ' + f.name); }
    }
    return out;
  }
  function makeDocImage(src, widthCm = 7) {
    const ratio = src.w / src.h;
    widthCm = Math.min(widthCm, CONTENT_W_CM);
    return {
      id: uid(), name: src.name, showCaption: true, align: 'left',
      widthCm, heightCm: round1(widthCm / ratio), lockRatio: true, ratio,
      dataUrl: src.dataUrl, mime: src.mime,
    };
  }
  function addImagesTo(target, srcs) {
    if (target.hf) {
      const im = makeDocImage(srcs[0], 4);
      im.align = state[target.hf].image?.align || 'left';
      state[target.hf].image = im;
      renderEditor(); changed();
      return;
    }
    const p = para(target.s, target.p);
    if (!p) return;
    srcs.forEach(s => p.images.push(makeDocImage(s)));
    renderEditor(); changed();
  }

  // ---------- Anteprima ----------
  function figureHtml(im) {
    const cap = im.showCaption && im.name ? `<figcaption>${esc(im.name)}</figcaption>` : '';
    return `<figure class="${im.align}" style="width:${im.widthCm}cm">
      <div style="width:${im.widthCm}cm;height:${im.heightCm}cm"><img src="${im.dataUrl}" alt="${esc(im.name)}"></div>${cap}</figure>`;
  }
  function hfHtml(key) {
    const hf = state[key];
    if (!hf.enabled || (!hf.text && !hf.image)) return '';
    const lines = hf.text.split('\n');
    const text = hf.text ? lines.map((l, k) => k === 0 && hf.boldFirst ? `<b>${esc(l)}</b>` : esc(l)).join('\n') : '';
    const im = hf.image;
    const side = im && hf.text && im.align !== 'center';
    const imgTag = im ? `<img src="${im.dataUrl}" alt="" style="width:${im.widthCm}cm;height:${im.heightCm}cm;${
      side ? '' : im.align === 'center' ? 'margin:0 auto' : im.align === 'right' ? 'margin-left:auto' : ''}">` : '';
    const cls = ['hf', key === 'letterhead' ? 'hf-head' : 'hf-foot', hf.line ? 'line' : '',
      side ? (im.align === 'right' ? 'img-right' : '') : 'stack'].join(' ');
    return `<div class="${cls}">${imgTag}${text ? `<div class="hf-text" style="text-align:${hf.textAlign}">${text}</div>` : ''}</div>`;
  }
  function renderPreview() {
    const h = [];
    if (state.title) h.push(`<h1 class="doc-title">${esc(state.title)}</h1>`);
    if (state.subtitle) h.push(`<div class="doc-subtitle">${esc(state.subtitle)}</div>`);
    if (state.toc.enabled) {
      const items = state.sections.filter(x => x.title.trim());
      h.push(`<div class="toc"><div class="toc-title">${esc(state.toc.title || 'Indice')}</div>${
        items.length ? items.map(x => `<div class="toc-item">${esc(x.title)}</div>`).join('') : '<div class="toc-item" style="color:#aaa">(nessun sottotitolo)</div>'}</div>`);
      h.push('<div class="page-break"><span>nuova pagina</span></div>');
    }
    // Le foto a sinistra/destra restano affiancate anche al testo dei paragrafi successivi,
    // fino a una foto centrata o al sottotitolo seguente
    state.sections.forEach(s => {
      if (s.title) h.push(`<h2 class="sec">${esc(s.title)}</h2>`);
      h.push('<div class="secbody">');
      s.paragraphs.forEach(p => {
        const floats = p.images.filter(i => i.align !== 'center');
        const centers = p.images.filter(i => i.align === 'center');
        if (!p.text && !p.images.length) return;
        h.push(p.text
          ? `<div class="pblock">${floats.map(figureHtml).join('')}<p class="ptext">${esc(p.text)}</p></div>`
          : floats.map(figureHtml).join(''));
        centers.forEach(c => h.push(figureHtml(c)));
      });
      h.push('</div>');
    });
    const st = state.style, pv = $('#preview').style;
    pv.setProperty('--body-font', cssFont(st.bodyFont));
    pv.setProperty('--head-font', cssFont(st.headFont));
    pv.setProperty('--body-size', st.bodySize + 'pt');
    pv.setProperty('--title-size', st.titleSize + 'pt');
    pv.setProperty('--h1-size', st.h1Size + 'pt');
    pv.setProperty('--accent', st.accent);
    pv.setProperty('--title-color', st.titleColor);
    pv.setProperty('--line', st.lineSpacing);
    pv.setProperty('--align', st.align);
    pv.setProperty('--title-align', st.titleAlign);
    pv.setProperty('--head-weight', st.headBold ? 700 : 400);
    pv.setProperty('--head-border', st.headLine ? `0.75pt solid ${st.accent}` : 'none');
    pv.setProperty('--title-transform', st.titleCaps ? 'uppercase' : 'none');
    pv.setProperty('--title-weight', st.titleCaps ? 700 : 400);
    const pn = state.pageNumbers;
    const pnHtml = pn.enabled ? `<div class="pnum" style="text-align:${pn.align}">${PN_FORMATS[pn.format]}</div>` : '';
    const notes = ['letterhead', 'footer'].filter(k => state[k].enabled && state[k].scope === 'first')
      .map(k => `${HF_LABEL[k]}: solo sulla prima pagina`);
    $('#preview').innerHTML = hfHtml('letterhead')
      + `<div class="pbody">${h.length ? h.join('') : '<div class="empty">L\'anteprima del documento apparirà qui.</div>'}</div>`
      + hfHtml('footer') + pnHtml
      + (notes.length ? `<div class="hf-note">${notes.join(' · ')}</div>` : '');
    fitPreview();
  }
  function fitPreview() {
    const wrap = $('#previewWrap'), page = $('#preview');
    page.style.zoom = 1;
    const avail = wrap.clientWidth - (window.innerWidth <= 1000 ? 24 : 48);
    if (avail <= 0) return;   // anteprima nascosta (scheda Modifica su telefono)
    const k = Math.min(1, avail / page.offsetWidth);
    page.style.zoom = k;
  }
  window.addEventListener('resize', fitPreview);

  // ---------- Eventi input ----------
  function setSize(im, which, val, root) {
    val = parseNum(val);
    if (!(val > 0)) return;
    val = Math.max(0.5, val);
    if (which === 'w') {
      im.widthCm = round1(Math.min(val, CONTENT_W_CM));
      if (im.lockRatio) im.heightCm = round1(im.widthCm / im.ratio);
    } else {
      im.heightCm = round1(val);

  // ---------- Export Word ----------
  function dataUrlToBytes(dataUrl) {
    const bin = atob(dataUrl.split(',')[1]);
    const out = new Uint8Array(bin.length);
    for (let k = 0; k < bin.length; k++) out[k] = bin.charCodeAt(k);
    return out;
  }
  const docxType = (mime) => mime === 'image/png' ? 'png' : mime === 'image/gif' ? 'gif' : 'jpg';

  // Per le foto affiancate al testo il nome viene disegnato sotto la foto (in Word una didascalia
  // non può "seguire" un'immagine flottante). Per le foto centrate resta testo modificabile.
  async function floatImageData(im) {
    if (!(im.showCaption && im.name)) {
      return { data: dataUrlToBytes(im.dataUrl), type: docxType(im.mime), wCm: im.widthCm, hCm: im.heightCm };
    }
    const source = await loadImage(im.dataUrl);
    const pxW = Math.min(source.naturalWidth, 1600);
    const pxPerCm = pxW / im.widthCm;
    const pxH = Math.round(im.heightCm * pxPerCm);
    const fontPx = 0.32 * pxPerCm, lineH = 0.42 * pxPerCm, pad = 0.15 * pxPerCm;
    const c = document.createElement('canvas');
    const ctx = c.getContext('2d');
    const capFont = `italic ${fontPx}px ${cssFont(state.style.bodyFont)}`;
    ctx.font = capFont;
    const lines = [];
    let cur = '';
    for (const w of im.name.split(/\s+/)) {
      const test = cur ? cur + ' ' + w : w;
      if (ctx.measureText(test).width > pxW * 0.96 && cur) { lines.push(cur); cur = w; } else cur = test;
    }
    if (cur) lines.push(cur);
    const bandPx = Math.round(pad * 2 + lines.length * lineH);
    c.width = pxW; c.height = pxH + bandPx;
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(source, 0, 0, pxW, pxH);
    ctx.font = capFont;
    ctx.fillStyle = '#555'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    lines.forEach((l, k) => ctx.fillText(l, pxW / 2, pxH + pad + lineH * (k + 0.5)));
    const mime = im.mime === 'image/png' ? 'image/png' : 'image/jpeg';
    const url = c.toDataURL(mime, 0.92);
    return { data: dataUrlToBytes(url), type: docxType(mime), wCm: im.widthCm, hCm: im.heightCm + bandPx / pxPerCm };
  }

  // Carta intestata / piè di pagina: logo accanto al testo (tabella senza bordi) oppure sopra
  function hfChildren(D, key) {
    const hf = state[key];
    if (!hf.enabled || (!hf.text && !hf.image)) return [];
    const isHead = key === 'letterhead';
    const AL = { left: D.AlignmentType.LEFT, center: D.AlignmentType.CENTER, right: D.AlignmentType.RIGHT };
    const textParas = () => hf.text ? hf.text.split('\n').map((l, k) => {
      const strong = k === 0 && hf.boldFirst;
      return new D.Paragraph({ alignment: AL[hf.textAlign], spacing: { after: 0 },
        children: [new D.TextRun({ text: l, bold: strong, size: strong ? 20 : 18, color: strong ? '000000' : '444444' })] });
    }) : [];
    const im = hf.image;
    const imgRun = () => new D.ImageRun({
      type: docxType(im.mime), data: dataUrlToBytes(im.dataUrl),
      transformation: { width: Math.round(im.widthCm * 96 / 2.54), height: Math.round(im.heightCm * 96 / 2.54) },
      altText: { name: 'Logo', title: 'Logo', description: '' },
    });
    const out = [];
    if (im && hf.text && im.align !== 'center') {
      const total = Math.round(CONTENT_W_CM * 567), imgW = Math.min(total - 1134, Math.round((im.widthCm + 0.5) * 567));
      const imgCell = new D.TableCell({ width: { size: imgW, type: D.WidthType.DXA }, verticalAlign: D.VerticalAlign.CENTER,
        children: [new D.Paragraph({ alignment: im.align === 'left' ? D.AlignmentType.LEFT : D.AlignmentType.RIGHT, children: [imgRun()] })] });
      const txtCell = new D.TableCell({ width: { size: total - imgW, type: D.WidthType.DXA }, verticalAlign: D.VerticalAlign.CENTER, children: textParas() });
      const left = im.align === 'left';
      out.push(new D.Table({
        width: { size: total, type: D.WidthType.DXA }, layout: D.TableLayoutType.FIXED, borders: D.TableBorders.NONE,
        columnWidths: left ? [imgW, total - imgW] : [total - imgW, imgW],
        rows: [new D.TableRow({ children: left ? [imgCell, txtCell] : [txtCell, imgCell] })],
      }));
    } else {
      if (im) out.push(new D.Paragraph({ alignment: AL[im.align], spacing: { after: hf.text ? 80 : 0 }, children: [imgRun()] }));
      out.push(...textParas());
    }
    if (hf.line) {
      const b = { style: D.BorderStyle.SINGLE, size: 6, color: '888888', space: 1 };
      const line = new D.Paragraph({ border: isHead ? { bottom: b } : { top: b }, spacing: { before: 0, after: 0, line: 100, lineRule: D.LineRuleType.EXACT }, children: [] });
      isHead ? out.push(line) : out.unshift(line);
    }
    return out;
  }
  function pageNumberChildren(D) {
    const pn = state.pageNumbers;
    if (!pn.enabled) return [];
    const C = D.PageNumber.CURRENT, T = D.PageNumber.TOTAL_PAGES;
    const parts = { 'n': [C], 'pagina': ['Pagina ', C], 'pagina-di': ['Pagina ', C, ' di ', T], 'n-di': [C, ' / ', T] }[pn.format];
    const AL = { left: D.AlignmentType.LEFT, center: D.AlignmentType.CENTER, right: D.AlignmentType.RIGHT };
    return [new D.Paragraph({ alignment: AL[pn.align], spacing: { before: 80 }, children: [new D.TextRun({ size: 18, color: '444444', children: parts })] })];
  }

  async function exportDocx(btn) {
    const D = window.docx;
    if (!D) { toast('Libreria Word non disponibile: verifica che docx.umd.js sia nella stessa cartella o la connessione internet.'); return; }
    const label = btn.textContent;
    btn.disabled = true; btn.textContent = 'Creazione in corso…';
    try {
      const CM_PX = 96 / 2.54, CM_EMU = 360000;
      const GAP_CM = 0.3, SIDE_GAP_CM = 0.4;
      const st = state.style, hex = (c) => c.replace('#', '');
      const AL = { left: D.AlignmentType.LEFT, center: D.AlignmentType.CENTER, right: D.AlignmentType.RIGHT, justify: D.AlignmentType.JUSTIFIED };
      const LINE_CM = st.bodySize * 0.0353 * 1.22 * st.lineSpacing;   // altezza stimata di una riga
      const CHARS_PER_CM = 26 / st.bodySize;                          // caratteri stimati per cm di riga
      const AFTER_CM = 200 / 567;                                     // spazio dopo ogni paragrafo
      const children = [];   // oggetti docx oppure { para, runs } costruiti alla fine

      // Interruzione "a capo dopo le immagini": il testo successivo riparte sotto le foto affiancate
      const clearRun = () => {
        const r = new D.TextRun({});
        r.root.push(new D.BuilderElement({ name: 'w:br', attributes: {
          type: { key: 'w:type', value: 'textWrapping' }, clear: { key: 'w:clear', value: 'all' } } }));
        return r;
      };

      if (state.title) children.push(new D.Paragraph({ heading: D.HeadingLevel.TITLE, children: [new D.TextRun(state.title)] }));
      if (state.subtitle) children.push(new D.Paragraph({
        alignment: AL[st.titleAlign], spacing: { after: 360 },
        children: [new D.TextRun({ text: state.subtitle, italics: true, size: 26, color: '555555', font: st.headFont })],
      }));

      // Indice: elenco dei sottotitoli; il contenuto riparte dalla pagina successiva
      const tocItems = state.toc.enabled ? state.sections.map(x => x.title.trim()).filter(Boolean) : [];
      if (state.toc.enabled) {
        children.push(new D.Paragraph({ spacing: { before: 240, after: 160 },
          children: [new D.TextRun({ text: state.toc.title || 'Indice', font: st.headFont, size: st.h1Size * 2, bold: true, color: hex(st.accent) })] }));
        tocItems.forEach(t => children.push(new D.Paragraph({ indent: { left: 284 }, spacing: { after: 80 }, children: [new D.TextRun(t)] })));
      }
      const contentStart = children.length;

      for (const s of state.sections) {
        if (s.title) children.push({ para: { heading: D.HeadingLevel.HEADING_1 }, runs: [new D.TextRun(s.title)] });

        // open = foto a sinistra/destra ancora affiancate al testo: cm che restano da "coprire" per lato
        let open = null, lastBlock = null;
        let carry = [];   // foto di un paragrafo senza testo: vengono ancorate al paragrafo successivo
        const closeFloats = () => {
          if (open) {
            if (lastBlock) lastBlock.runs.push(clearRun());
            else children.push({ para: {}, runs: [clearRun()] });
          }
          open = null;
        };

        for (const p of s.paragraphs) {
          if (!p.text && !p.images.length) continue;
          const floats = p.images.filter(i => i.align !== 'center');
          const centers = p.images.filter(i => i.align === 'center');

          // Foto a sinistra/destra: ancorate al paragrafo, il testo (anche dei paragrafi seguenti) scorre accanto
          const runs = [];
          if (floats.length) {
            open = open || { left: 0, right: 0, wl: 0, wr: 0 };
            const stack = { left: Math.max(0, open.left), right: Math.max(0, open.right) };
            for (const im of floats) {
              const d = await floatImageData(im);
              const side = im.align;
              runs.push(new D.ImageRun({
                type: d.type, data: d.data,
                transformation: { width: Math.round(d.wCm * CM_PX), height: Math.round(d.hCm * CM_PX) },
                altText: { name: im.name || 'Foto', title: im.name || 'Foto', description: im.name || '' },
                floating: {
                  allowOverlap: false,
                  horizontalPosition: { relative: D.HorizontalPositionRelativeFrom.MARGIN, align: side === 'left' ? D.HorizontalPositionAlign.LEFT : D.HorizontalPositionAlign.RIGHT },
                  verticalPosition: { relative: D.VerticalPositionRelativeFrom.PARAGRAPH, offset: Math.round(stack[side] * CM_EMU) },
                  wrap: { type: D.TextWrappingType.SQUARE, side: side === 'left' ? D.TextWrappingSide.RIGHT : D.TextWrappingSide.LEFT },
                  margins: {
                    left: side === 'right' ? SIDE_GAP_CM * CM_EMU : 0, right: side === 'left' ? SIDE_GAP_CM * CM_EMU : 0,
                    top: 0, bottom: GAP_CM * CM_EMU,
                  },
                },
              }));
              stack[side] += d.hCm + GAP_CM;
              if (side === 'left') open.wl = Math.max(open.wl, d.wCm + SIDE_GAP_CM);
              else open.wr = Math.max(open.wr, d.wCm + SIDE_GAP_CM);
            }
            open.left = stack.left; open.right = stack.right;
          }

          if (!p.text && !centers.length) { carry.push(...runs); continue; }

          const textLines = p.text.split('\n');
          const textRuns = textLines.map((l, k) => new D.TextRun({ text: l, break: k > 0 ? 1 : 0 }));
          const block = { para: { alignment: AL[st.align], spacing: { after: 200 } }, runs: [...carry, ...runs, ...textRuns] };
          carry = [];
          children.push(block);
          lastBlock = block;

          // Stima quanto testo scorre accanto alle foto; quando le ha superate non serve più andare a capo
          if (open) {
            const availCm = Math.max(3, CONTENT_W_CM - (open.left > 0 ? open.wl : 0) - (open.right > 0 ? open.wr : 0));
            const lines = textLines.reduce((n, l) => n + Math.max(1, Math.ceil(l.length / (availCm * CHARS_PER_CM))), 0);
            const usedCm = lines * LINE_CM + AFTER_CM;
            open.left -= usedCm; open.right -= usedCm;
            if (Math.max(open.left, open.right) < -LINE_CM) open = null;
          }

          // Foto centrate: sotto il testo (e sotto le foto affiancate), con didascalia modificabile
          if (centers.length) closeFloats();
          for (const im of centers) {
            children.push({
              para: { alignment: D.AlignmentType.CENTER, spacing: { before: 120, after: im.showCaption && im.name ? 40 : 200 }, keepNext: true },
              runs: [new D.ImageRun({
                type: docxType(im.mime), data: dataUrlToBytes(im.dataUrl),
                transformation: { width: Math.round(im.widthCm * CM_PX), height: Math.round(im.heightCm * CM_PX) },
                altText: { name: im.name || 'Foto', title: im.name || 'Foto', description: im.name || '' },
              })],
            });
            if (im.showCaption && im.name) children.push(new D.Paragraph({
              alignment: D.AlignmentType.CENTER, spacing: { after: 240 },
              children: [new D.TextRun({ text: im.name, italics: true, size: 18, color: '555555' })],
            }));
          }
          if (centers.length) lastBlock = null;
        }
        if (carry.length) { lastBlock = { para: { spacing: { after: 200 } }, runs: carry }; children.push(lastBlock); }
        closeFloats();
      }
      // Con l'indice, il primo sottotitolo/paragrafo inizia su una pagina nuova
      if (state.toc.enabled && children[contentStart]?.runs) children[contentStart].para.pageBreakBefore = true;
      const body = children.map(c => c.runs ? new D.Paragraph({ ...c.para, children: c.runs }) : c);

      const orEmpty = (arr) => arr.length ? arr : [new D.Paragraph('')];
      const doc = new D.Document({
        creator: 'Editor Documenti',
        // le righe andate a capo con Invio non vengono "stirate" nel testo giustificato
        compatibility: { doNotExpandShiftReturn: true },
        title: state.title || 'Documento',
        styles: { default: {
          document: { run: { font: st.bodyFont, size: Math.round(st.bodySize * 2) }, paragraph: { spacing: { line: Math.round(st.lineSpacing * 240) } } },
          title: {
            run: { font: st.headFont, size: st.titleSize * 2, color: hex(st.titleColor), bold: st.titleCaps, allCaps: st.titleCaps },
            paragraph: { alignment: AL[st.titleAlign], spacing: { after: 80, line: 240 } },
          },
          heading1: {
            run: { font: st.headFont, size: st.h1Size * 2, color: hex(st.accent), bold: st.headBold },
            paragraph: { spacing: { before: 360, after: 120, line: 240 }, keepNext: true,
              border: st.headLine ? { bottom: { style: D.BorderStyle.SINGLE, size: 6, color: hex(st.accent), space: 2 } } : undefined },
          },
        } },
        sections: [{
          properties: {
            titlePage: true,   // prima pagina con intestazione/piè propri
            page: { size: { width: 11906, height: 16838 }, margin: { top: 1134, bottom: 1134, left: 1134, right: 1134, header: 567, footer: 567 } },
          },
          headers: {
            first: new D.Header({ children: orEmpty(hfChildren(D, 'letterhead')) }),
            default: new D.Header({ children: orEmpty(state.letterhead.scope === 'all' ? hfChildren(D, 'letterhead') : []) }),
          },
          footers: {
            first: new D.Footer({ children: orEmpty([...hfChildren(D, 'footer'), ...pageNumberChildren(D)]) }),
            default: new D.Footer({ children: orEmpty([...(state.footer.scope === 'all' ? hfChildren(D, 'footer') : []), ...pageNumberChildren(D)]) }),
          },
          children: body.length ? body : [new D.Paragraph('')],
        }],
      });
      const blob = await D.Packer.toBlob(doc);
      const name = fileBase() + '.docx';
      if (IS_IOS) {
        // su iPhone/iPad si sceglie se condividerlo (es. aprirlo in Word) o salvarlo in File
        lastDocx = new File([blob], name, { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
        $('#shareModal').classList.add('open');
      } else {
        download(blob, name);
        toast('Documento Word scaricato');
      }
    } catch (err) {
      console.error(err);
      toast('Errore nella creazione del file Word: ' + err.message);
    } finally {
      btn.disabled = false; btn.textContent = label;
    }
  }

  // ---------- Eventi in calendario (.ics) ----------
  // Inserisce da sola le "/" e i ":" mentre si scrive (es. 01102026 -> 01/10/2026, 930 -> 9:30 -> 09:30)
  function maskDate(v) {
    if (/[\/.\-]/.test(v)) {   // scritta con i separatori, es. 5/11/2026
      const [a = '', b = '', c = ''] = v.split(/[\/.\-]/).map(x => x.replace(/\D/g, ''));
      return [a.slice(0, 2), b.slice(0, 2), c.slice(0, 4)].slice(0, v.split(/[\/.\-]/).length).join('/');
    }
    const d = v.replace(/\D/g, '').slice(0, 8);
    return [d.slice(0, 2), d.slice(2, 4), d.slice(4)].filter(Boolean).join('/');
  }
  function maskTime(v) {
    if (/[:.]/.test(v)) {        // scritta con i separatori, es. 9:30 o 9.30
      const [h = '', m = ''] = v.split(/[:.]/).map(x => x.replace(/\D/g, ''));
      return h.slice(0, 2) + ':' + m.slice(0, 2);
    }
    const d = v.replace(/\D/g, '').slice(0, 4);
    return d.length > 2 ? d.slice(0, 2) + ':' + d.slice(2) : d;
  }
  // All'uscita dal campo completa con lo zero iniziale: 5/11/2026 -> 05/11/2026, 9:30 -> 09:30
  function padDate(v) {
    const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(v);
    return m ? `${m[1].padStart(2, '0')}/${m[2].padStart(2, '0')}/${m[3]}` : v;
  }
  function padTime(v) {
    const m = /^(\d{1,2}):(\d{2})$/.exec(v);
    return m ? `${m[1].padStart(2, '0')}:${m[2]}` : v;
  }
  function parseEventDate(ev) {
    const md = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(ev.date);
    const mt = /^(\d{2}):(\d{2})$/.exec(ev.time);
    if (!md || !mt) return null;
    const [dd, mm, yy, hh, mi] = [md[1], md[2], md[3], mt[1], mt[2]].map(Number);
    const dt = new Date(yy, mm - 1, dd, hh, mi);
    if (dt.getFullYear() !== yy || dt.getMonth() !== mm - 1 || dt.getDate() !== dd || hh > 23 || mi > 59) return null;
    return dt;
  }
  function eventProblem(s) {
    const ev = s.event;
    if (!ev.date && !ev.time) return 'Inserisci data e ora';
    if (!/^\d{2}\/\d{2}\/\d{4}$/.test(ev.date)) return 'Data nel formato gg/mm/aaaa';
    if (!/^\d{2}:\d{2}$/.test(ev.time)) return 'Ora nel formato 00:00';
    if (!parseEventDate(ev)) return 'Data o ora non valida';
    if (!s.title.trim()) return 'Scrivi il sottotitolo: sarà il nome ' + (ev.kind === 'promemoria' ? 'del promemoria' : 'dell\'evento');
    return '';
  }
  // Testo per il formato iCalendar: caratteri speciali protetti e righe lunghe spezzate a 75 byte
  const icsEscape = (t) => t.replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
  function icsFold(line) {
    const enc = new TextEncoder(), out = [];
    let cur = '', bytes = 0;
    for (const ch of line) {
      const b = enc.encode(ch).length;
      if (bytes + b > (out.length ? 74 : 75)) { out.push(cur); cur = ''; bytes = 0; }
      cur += ch; bytes += b;
    }
    out.push(cur);
    return out.join('\r\n ');
  }
  const icsDate = (d) => `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}T${String(d.getHours()).padStart(2, '0')}${String(d.getMinutes()).padStart(2, '0')}00`;
  // Sul Mac passa i dati a Editor Documenti.app (link editordocumenti://), che crea
  // l'evento nel calendario di default o il promemoria nella lista di default.
  // Su iPhone/iPad gli eventi passano dal file .ics, che il sistema propone di aggiungere.
  function addEvent(s) {
    const problem = eventProblem(s);
    if (problem) { toast(problem); return; }
    const ev = s.event, isRem = ev.kind === 'promemoria';
    if (IS_IOS) {
      if (isRem) { toast('Il promemoria si può creare solo sul Mac'); return; }
      exportEvent(s); return;
    }
    const [dd, mm, yy] = ev.date.split('/');
    const notes = ev.includeText ? s.paragraphs.map(p => p.text.trim()).filter(Boolean).join('\n\n') : '';
    const q = new URLSearchParams({ tipo: ev.kind, titolo: s.title.trim(), inizio: `${yy}-${mm}-${dd}T${ev.time}` });
    if (notes) q.set('note', notes);
    if (ev.alert !== 'none') q.set('avviso', ev.alert);
    const a = document.createElement('a');
    a.href = 'editordocumenti://aggiungi?' + q.toString().replace(/\+/g, '%20');
    document.body.appendChild(a); a.click(); a.remove();
    toast(isRem ? 'Invio a Promemoria… conferma nella finestra che compare'
                : 'Invio a Calendario… conferma nella finestra che compare');
  }

  function exportEvent(s) {
    const problem = eventProblem(s);
    if (problem) { toast(problem); return; }
    const ev = s.event, start = parseEventDate(ev), end = new Date(start.getTime() + 60 * 60 * 1000);
    const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
    const notes = ev.includeText ? s.paragraphs.map(p => p.text.trim()).filter(Boolean).join('\n\n') : '';
    const lines = [
      'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Editor Documenti//IT', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
      'BEGIN:VEVENT',
      `UID:${s.id}-${Date.now()}@editor-documenti`,
      `DTSTAMP:${stamp}`,
      `DTSTART:${icsDate(start)}`,           // ora locale del dispositivo
      `DTEND:${icsDate(end)}`,
      `SUMMARY:${icsEscape(s.title.trim())}`,
    ];
    if (notes) lines.push(`DESCRIPTION:${icsEscape(notes)}`);
    if (ev.alert !== 'none') {
      lines.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEscape(s.title.trim())}`,
        `TRIGGER:${ev.alert === '0' ? 'PT0M' : '-PT' + ev.alert + 'M'}`, 'END:VALARM');
    }
    lines.push('END:VEVENT', 'END:VCALENDAR');
    const ics = lines.map(icsFold).join('\r\n') + '\r\n';
    const name = (s.title.trim().replace(/[\\/:*?"<>|]+/g, '').slice(0, 60) || 'evento') + '.ics';
    download(new Blob([ics], { type: 'text/calendar;charset=utf-8' }), name);
    toast(IS_IOS ? 'Apri il file per aggiungerlo al Calendario' : 'Evento scaricato: aprilo per aggiungerlo al Calendario');
  }

  // ---------- Cancellazione dei dati dal dispositivo ----------
  function wipeDevice() {
    if (!confirm('Cancellare il documento, le foto e la libreria memorizzati in questo browser?\n\n'
      + 'Tutto ciò che non hai salvato con "Salva progetto" o scaricato in Word andrà perso.')) return;
    clearTimeout(saveTimer);                       // evita che un salvataggio in sospeso riscriva i dati
    try { localStorage.removeItem(STORAGE_KEY); } catch {}
    state = defaultDoc();
    library = [];
    lastDocx = null;
    pendingTarget = null;
    ['#fileImgs', '#fileFolder', '#fileLibImgs', '#fileJson'].forEach(sel => { $(sel).value = ''; });
    document.querySelectorAll('.modal-bg.open').forEach(m => m.classList.remove('open'));
    renderEditor();
    renderPreview();                               // senza salvare: la memoria del browser resta vuota
    toast('Documento cancellato da questo dispositivo');
  }

  // ---------- iPhone / iPad ----------
  let lastDocx = null;
  async function shareDocx() {
    if (!lastDocx) return;
    if (navigator.canShare && navigator.canShare({ files: [lastDocx] })) {
      try { await navigator.share({ files: [lastDocx], title: lastDocx.name }); $('#shareModal').classList.remove('open'); }
      catch (err) { if (err.name !== 'AbortError') toast('Condivisione non riuscita: usa "Salva in File".'); }
    } else {
      toast('Condivisione non disponibile: usa "Salva in File".');
    }
  }
  function setView(v) {
    document.body.dataset.view = v;
    document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
    if (v === 'preview') fitPreview();
    window.scrollTo(0, 0);
  }
  document.body.dataset.view = 'edit';
  $('#shareModal').addEventListener('click', (e) => { if (e.target.id === 'shareModal') e.target.classList.remove('open'); });

  // ---------- Varie ----------
  let toastTimer;
  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
  }

  renderEditor();
  renderPreview();
})();
</script>
</body>
</html>
